name: application-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CAFE_OPERATOR_KEY: ci-only-test-key
      CAFE_CLASSIFIER_READ_ONLY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run deterministic tests
        run: python -m pytest -m "not live and not service" tests/ -q
      - name: Check imports and dependency consistency
        run: >-
          python -m compileall -q
          main.py db.py models.py cafe_logging.py cli.py mcp_server.py
          agents layers middleware routers
          && python -m pip check
