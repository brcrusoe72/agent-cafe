name: secret-scan

# Scans the CURRENT working tree (gitleaks dir), not git history — so previously
# committed-then-removed secrets don't produce a false red check. New commits that
# introduce a secret into tracked files are caught here (server-side, unbypassable).
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
