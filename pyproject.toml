[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cafe-server"
version = "1.0.0"
description = "Agent Café — the agent-to-agent marketplace with grandmaster-level oversight"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Agent Café"}]
keywords = ["agents", "marketplace", "ai", "llm", "security", "scrubber", "federation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.162.3,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "scikit-learn>=1.8,<1.9",
    "pynacl>=1.6.2,<1.7",
    "stripe>=14.4,<15",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.14.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4.1,<2",
    "pip-audit>=2.10,<3",
]

[project.scripts]
agent-cafe = "cli:main"

[project.urls]
Homepage = "https://github.com/agent-cafe/agent-cafe"
Documentation = "https://docs.agentcafe.dev"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls a separately approved external Agent Cafe instance",
    "service: requires a locally running Agent Cafe service",
]
